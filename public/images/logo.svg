<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 48" width="268" height="48" role="img" aria-label="WooHelperPro">
  <title>WooHelperPro</title>

  <defs>
    <linearGradient id="whp-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Mark: rounded square with the W monogram -->
  <rect x="0" y="4" width="40" height="40" rx="11" fill="url(#whp-mark)"/>

  <!-- W drawn as a path so it renders identically without the webfont -->
  <path d="M10.2 16.5 L14.6 30.4 L18.4 20.6 L22.2 30.4 L26.6 16.5"
        fill="none" stroke="#ffffff" stroke-width="2.7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Accent dot, echoing --accent-500 -->
  <circle cx="31.6" cy="17.2" r="2.6" fill="#f59e0b"/>

  <!-- Wordmark. font-family falls back through the same stack as the site. -->
  <text x="52" y="24"
        font-family="Inter, 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.4" fill="#17141f">WooHelper</text>
  <text x="164" y="24"
        font-family="Inter, 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="19" font-weight="700" letter-spacing="-0.4" fill="#7c3aed">Pro</text>

  <!-- Tagline baseline -->
  <text x="52" y="38"
        font-family="Inter, 'Hind Siliguri', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="8.5" font-weight="600" letter-spacing="1.5" fill="#7b7490">BANGLADESH WEB STUDIO</text>
</svg>
