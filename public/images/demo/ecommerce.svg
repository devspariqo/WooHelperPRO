<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="E-commerce storefront demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".10"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- soft glow -->
  <circle cx="640" cy="90" r="180" fill="#ffffff" opacity=".07"/>
  <circle cx="120" cy="400" r="150" fill="#ffffff" opacity=".05"/>

  <!-- browser chrome -->
  <rect x="70" y="72" width="660" height="306" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity=".25"/>
  <rect x="70" y="72" width="660" height="34" rx="14" fill="#ffffff" fill-opacity=".14"/>
  <circle cx="94" cy="89" r="5" fill="#ffffff" fill-opacity=".55"/>
  <circle cx="112" cy="89" r="5" fill="#ffffff" fill-opacity=".4"/>
  <circle cx="130" cy="89" r="5" fill="#ffffff" fill-opacity=".28"/>
  <rect x="156" y="81" width="180" height="16" rx="8" fill="#ffffff" fill-opacity=".2"/>

  <!-- product grid -->
  <g fill="#ffffff" fill-opacity=".9">
    <rect x="98" y="132" width="188" height="104" rx="9" fill-opacity=".16"/>
    <rect x="306" y="132" width="188" height="104" rx="9" fill-opacity=".16"/>
    <rect x="514" y="132" width="188" height="104" rx="9" fill-opacity=".16"/>
  </g>
  <g fill="#ffffff" fill-opacity=".38">
    <rect x="98" y="250" width="140" height="10" rx="5"/>
    <rect x="98" y="268" width="92" height="10" rx="5"/>
    <rect x="306" y="250" width="140" height="10" rx="5"/>
    <rect x="306" y="268" width="92" height="10" rx="5"/>
    <rect x="514" y="250" width="140" height="10" rx="5"/>
    <rect x="514" y="268" width="92" height="10" rx="5"/>
  </g>
  <g fill="#ffffff" fill-opacity=".55">
    <rect x="98" y="296" width="78" height="26" rx="13"/>
    <rect x="306" y="296" width="78" height="26" rx="13"/>
    <rect x="514" y="296" width="78" height="26" rx="13"/>
  </g>

  <!-- price tag -->
  <g transform="translate(600,336)">
    <rect x="0" y="0" width="118" height="32" rx="16" fill="#ffffff"/>
    <text x="59" y="21" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
          font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">৳ 12,500</text>
  </g>
</svg>
